<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open shop on SupreCart</title>
  <style>
    body{font-family:system-ui,sans-serif;text-align:center;padding:48px 24px;color:#12201C}
    a.btn{display:block;max-width:320px;margin:14px auto;padding:16px;border-radius:14px;
          font-weight:700;text-decoration:none}
    .primary{background:#0B6B58;color:#fff}
    .secondary{background:#DCF2EA;color:#08493D}
    .disabled{opacity:.55;pointer-events:none}
  </style>
</head>
<body>
  <h2 id="title">Opening this shop in SupreCart…</h2>
  <a id="open" class="btn primary" href="#">Open in app</a>
  <a class="btn secondary" href="/">Download SupreCart</a>

  <script>
    // Shop id comes from the path (/shop/123). A query fallback (?seller=123)
    // rescues links when a host strips the path — Cloudflare Pages pretty-URL
    // redirects turn /shop/123 into /shop and keep the query string.
    const segments = location.pathname.split("/").filter(Boolean);
    const lastSeg = segments.length ? segments[segments.length - 1] : "";
    const pathId = /^\d+$/.test(lastSeg) ? lastSeg : "";
    const params = new URLSearchParams(location.search);
    const qRaw = params.get("seller") || params.get("shop") || params.get("id") || "";
    const queryId = /^\d+$/.test(qRaw) ? qRaw : "";
    const id = pathId || queryId;
    const isValid = id !== "";

    const PACKAGE = "com.suprecart.suprecart";
    const fallback = encodeURIComponent(location.origin + "/");
    const isAndroid = /android/i.test(navigator.userAgent);

    const openBtn = document.getElementById("open");
    const title = document.getElementById("title");

    if (!isValid) {
      title.textContent = "This shop link is invalid.";
      openBtn.classList.add("disabled");
      openBtn.setAttribute("aria-disabled", "true");
      openBtn.removeAttribute("href");
    } else {
      const intentUrl =
        `intent://shop/${id}#Intent;scheme=suprecart;package=${PACKAGE};` +
        `S.browser_fallback_url=${fallback};end`;
      const schemeUrl = `suprecart://shop/${id}`;

      openBtn.href = isAndroid ? intentUrl : schemeUrl;

      // Auto-try on Android Chrome; the button is the backup for in-app browsers
      if (isAndroid) location.href = intentUrl;
    }
  </script>
</body>
</html>
